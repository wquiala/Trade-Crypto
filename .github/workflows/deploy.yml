name: Deploy to AWS EC2

on:
  push:
    branches:
      - main # O cambia a 'master' si esa es tu rama principal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # Navegar al directorio del repositorio en tu servidor AWS
            # Si lo clonaste en otra ruta (ej. /var/www/html/Trade-Crypto), cámbialo aquí
            cd /home/ubuntu/Trade-Crypto
            
            # Descargar los últimos cambios forzando sobreescritura (para evitar conflictos)
            git fetch --all
            git reset --hard origin/main
            
            # Navegar a la carpeta del bot
            cd q-trade-pro
            
            # Activar el entorno virtual e instalar dependencias nuevas (si las hay)
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Reiniciar el servicio de systemd que mantiene vivo al bot (Backend)
            sudo systemctl restart bot-trading
            
            # ---- DESPLIEGUE DEL FRONTEND ----
            cd frontend
            
            # Instalar dependencias del frontend
            npm install
            
            # Compilar el frontend (React/Vite)
            npm run build
            
            # Iniciar o reiniciar el frontend con PM2 (Servidor estático en el puerto 3000)
            pm2 restart trade-frontend || pm2 serve dist 3000 --name "trade-frontend" --spa
            
            # Guardar la configuración de PM2
            pm2 save

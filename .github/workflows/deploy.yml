name: Deploy to AWS EC2

on:
  push:
    branches:
      - main # O cambia a 'master' si esa es tu rama principal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # 🚨 IMPORTANTE: El código del bot NUNCA debe estar en /var/www/html/
            # porque tu archivo .env con las claves secretas quedaría expuesto a internet.
            # El repositorio debe vivir en /home/ubuntu/Trade-Crypto
            
            # 1. Navegar al repositorio seguro
            cd /home/ubuntu/Trade-Crypto
            
            # (Opcional) Arreglar permisos de git por si acaso
            git config --global --add safe.directory /home/ubuntu/Trade-Crypto
            
            # 2. Bajar cambios de Github
            git fetch --all
            git reset --hard origin/main
            
            # 3. Actualizar el bot de Python
            cd q-trade-pro
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Reiniciar el servicio (Ignorar error si el servicio aún no existe)
            sudo systemctl restart bot-trading || echo "Servicio bot-trading no encontrado, saltando..."
            
            # 4. Desplegar the Frontend (solo los archivos estáticos) a Apache
            cd frontend
            
            # Crear y limpiar la carpeta pública de Apache
            sudo mkdir -p /var/www/html/Trade-Crypto
            sudo rm -rf /var/www/html/Trade-Crypto/*
            
            # Copiar SOLO la carpeta dist a la zona pública
            sudo cp -r dist/* /var/www/html/Trade-Crypto/
            
            # Asignar permisos correctos para Apache
            sudo chown -R www-data:www-data /var/www/html/Trade-Crypto/
            sudo chmod -R 755 /var/www/html/Trade-Crypto/
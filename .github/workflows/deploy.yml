name: Deploy to AWS EC2

on:
  push:
    branches:
      - main # O cambia a 'master' si esa es tu rama principal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # --- AUTO-MIGRACIÓN DE SEGURIDAD ---
            # Si el repositorio sigue en la carpeta pública, lo movemos a la zona segura automáticamente
            if [ -d "/var/www/html/Trade-Crypto/.git" ] || [ -d "/var/www/html/Trade-Crypto/q-trade-pro" ]; then
                echo "Moviendo repositorio a una zona segura..."
                sudo mv /var/www/html/Trade-Crypto /home/ubuntu/Trade-Crypto || true
                sudo chown -R ubuntu:ubuntu /home/ubuntu/Trade-Crypto
            fi
            
            # Asegurarnos de que exista la carpeta por si acaso
            mkdir -p /home/ubuntu/Trade-Crypto
            
            # 1. Navegar al repositorio seguro
            cd /home/ubuntu/Trade-Crypto
            
            # (Opcional) Arreglar permisos de git por si acaso
            git config --global --add safe.directory /home/ubuntu/Trade-Crypto
            
            # 2. Bajar cambios de Github
            git fetch --all
            git reset --hard origin/main
            
            # 3. Actualizar el bot de Python
            cd q-trade-pro
            
            # Auto-crear entorno virtual si no existe
            if [ ! -d "venv" ]; then
                echo "Creando entorno virtual de Python..."
                sudo apt-get install python3-venv -y || true
                python3 -m venv venv
            fi
            
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Reiniciar o arrancar el bot de Python usando PM2
            pm2 restart bot-trading || pm2 start main.py --interpreter ./venv/bin/python --name "bot-trading"
            pm2 save
            
            # 4. Desplegar the Frontend (solo los archivos estáticos) a Apache
            cd frontend
            
            # Instalar dependencias y compilar el frontend
            npm install
            npm run build
            
            # Crear y limpiar la carpeta pública de Apache
            sudo mkdir -p /var/www/html/Trade-Crypto
            sudo rm -rf /var/www/html/Trade-Crypto/*
            
            # Copiar SOLO la carpeta dist a la zona pública
            sudo cp -r dist/* /var/www/html/Trade-Crypto/
            
            # Asignar permisos correctos para Apache s
            sudo chown -R www-data:www-data /var/www/html/Trade-Crypto/
            sudo chmod -R 755 /var/www/html/Trade-Crypto/
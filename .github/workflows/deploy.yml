name: Deploy to AWS EC2

on:
  push:
    branches:
      - main # O cambia a 'master' si esa es tu rama principal

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.AWS_HOST }}
          username: ${{ secrets.AWS_USER }}
          key: ${{ secrets.AWS_SSH_KEY }}
          script: |
            # Navegar al directorio del repositorio en tu servidor AWS
            # Si lo clonaste en otra ruta (ej. /var/www/html/Trade-Crypto), cámbialo aquí

            # Asignar los permisos correctos para que Apache pueda leer los archivos
            sudo chown -R www-data:www-data /var/www/html/
            sudo chmod -R 755 /var/www/html/
            
            cd /var/www/html/Trade-Crypto
            
            # Descargar los últimos cambios forzando sobreescritura (para evitar conflictos)
            git fetch --all
            git reset --hard origin/main
            
            # Navegar a la carpeta del bot
            cd q-trade-pro
            
            # Activar el entorno virtual e instalar dependencias nuevas (si las hay)
            source venv/bin/activate
            pip install -r requirements.txt
            
            # Reiniciar el servicio de systemd que mantiene vivo al bot (Backend)
            sudo systemctl restart bot-trading
            
            # ---- DESPLIEGUE DEL FRONTEND (Para Apache) ----
            cd frontend
            
            # Ya no compilamos en AWS. Usaremos la carpeta 'dist' que subiste a Github.
            
            # Crear la carpeta destino en Apache (si no existe) y limpiarla
            # Ajusta esta ruta si tu VirtualHost de Apache apunta a otro lado
            
            # Copiar los archivos compilados a la carpeta pública de Apache
            sudo cp -r dist/* /var/www/html/Trade-Crypto/
            
            